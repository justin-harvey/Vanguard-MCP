# Fly.io app for the Civic-Chain Grant & Budget Auditor hosted demo (S7).
# (regenerated by `fly launch` 2026-11-15; see https://docs.fly.io/reference/configuration)
#
# ISOLATION: this app lives in the `personal` org, which holds NOTHING from any
# Civic-Chain production system. The demo serves synthetic data only; that
# isolation is the product's trust story. Do not co-locate it with anything real.
#
# primary_region is `ewr` (Secaucus, NJ) because `bos` (Boston) is retired. The
# auditor_data volume MUST be created in the same region as the machine.

app = 'civic-chain-auditor-demo'
primary_region = 'ewr'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8787'

[[mounts]]
  source = 'auditor_data'
  destination = '/data'

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'get'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
